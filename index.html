html,body,#root{

img,svg,iframe,video{
  max-width:100%

article,section,header,footer,div{
  max-width:100%;
  min-width:0

/* --- Responsive shell / header (phone + tablet) --- */

.app-shell{
  min-height:100dvh
}

.app-header{
  position:sticky;
  top:var(--safe-area-inset-top);
  z-index:50;
  height:auto;
  min-height:64px;
  overflow:visible;
  -webkit-overflow-scrolling:touch
}

.header-inner{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:12px 16px;
  min-width:0;
  width:100%
}

.header-brand,.header-clock,.header-go{
  min-width:0
}

.header-clock{
  flex:1 1 200px;
  min-width:170px
}

.header-clock-text{
  font-size:clamp(18px,3.2vw,24px);
  line-height:1.15;
  overflow-wrap:anywhere
}

.header-controls{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:8px;
  flex:1 1 auto;
  min-width:0
}

.header-updated{
  flex:0 1 210px;
  min-width:170px;
  max-width:230px
}

/* --- Main grid: desktop 320 | 460 | 1fr --- */

.layout-main{
  display:grid;
  grid-template-columns:320px 460px minmax(0,1fr);
  gap:12px;
  align-items:start;
  width:100%;
  overflow:visible
}

.layout-main > section{
  min-width:0
}

.radar-frame{
  height:720px;
  min-height:640px
}

.gauge-wrap{
  max-width:300px
}

@media (max-width:1100px){
  .layout-main{
    grid-template-columns:300px minmax(0,1fr);
    grid-template-areas:"tides appraisal" "radar radar"
  }

  .layout-left{
    grid-area:tides
  }

  .layout-appraisal{
    grid-area:appraisal;
    width:auto!important;
    min-width:0!important;
    max-width:none!important
  }

  .layout-radar{
    grid-area:radar
  }

  .radar-frame{
    height:580px;
    min-height:480px
  }

  .header-controls{
    flex-basis:100%;
    padding-top:8px;
    border-top:1px solid var(--line)
  }

  .header-clock-text{
    font-size:clamp(18px,3vw,22px)
  }
}

@media (max-width:768px){
  .layout-main{
    grid-template-columns:minmax(0,1fr);
    grid-template-areas:none;
    padding:10px
  }

  .layout-left{
    display:contents
  }

  .tides-block{
    order:1
  }

  .layout-appraisal{
    order:2
  }

  .gauge-block{
    order:3
  }

  .layout-radar{
    order:4
  }

  .layout-left > article,.layout-appraisal,.layout-radar{
    width:100%
  }

  .header-inner{
    gap:8px 10px;
    padding:10px 12px!important
  }

  .header-brand{
    flex:1 1 auto
  }

  .header-clock{
    flex:1 1 160px;
    min-width:150px
  }

  .header-clock-text{
    font-size:19px
  }

  .header-controls{
    gap:6px
  }

  .header-controls button,.header-controls .header-updated{
    font-size:12px
  }

  .header-controls button{
    padding:6px 10px
  }

  .radar-frame{
    height:520px!important;
    min-height:400px!important;
    aspect-ratio:auto
  }

  .gauge-wrap{
    max-width:260px;
    width:260px
  }

  .tile-value{
    font-size:15px!important
  }

  .appraisal-tile{
    padding:8px 10px!important
  }

  .tile-head{
    flex-wrap:wrap;
    row-gap:3px
  }

  .tile-head-label{
    flex:1 1 100%;
    max-width:100%
  }

  .tile-head-label > span{
    max-width:100%
  }
}

@media (max-width:480px){
  .layout-main{
    padding:8px;
    gap:10px
  }

  .header-inner{
    padding:8px 10px!important;
    gap:6px 8px
  }

  .header-clock{
    min-width:0;
    flex-basis:150px
  }

  .header-clock-text{
    font-size:17px
  }

  .header-updated{
    flex-basis:100%;
    max-width:none
  }

  .gauge-wrap{
    max-width:250px;
    width:100%
  }

  .tide-legend{
    overflow-wrap:anywhere
  }
}
