}

  letter-spacing:.02em
}

  font-variant-numeric:tabular-nums
}

.bezel{
  background:conic-gradient(from 210deg,#f8fafc,#94a3b8,#e2e8f0,#64748b,#f8fafc,#94a3b8,#e2e8f0);
  box-shadow:0 10px 28px rgba(2,20,40,.24),inset 0 2px 2px #fff,inset 0 -3px 6px rgba(0,0,0,.2)
}

.radar-grid{
  background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);
  background-size:32px 32px
}

@keyframes pulseDot{
  0%,100%{
    r:5;
    opacity:1
  }

  50%{
    r:8;
    opacity:.55
  }
}

@keyframes sweep{
  from{
    transform:rotate(0deg)
  }

  to{
    transform:rotate(360deg)
  }
}

@keyframes drift{
  from{
    transform:translateX(-18px)
  }

  to{
    transform:translateX(18px)
  }
}

@keyframes rainMove{
  from{
    background-position:0 0
  }

  to{
    background-position:90px 180px
  }
}

.pulse-dot{
  animation:pulseDot 1.4s ease-in-out infinite
}

@keyframes redPulse{
  0%,100%{
    box-shadow:0 0 0 0 rgba(220,38,38,.55);
    transform:scale(1)
  }

  50%{
    box-shadow:0 0 0 7px rgba(220,38,38,0);
    transform:scale(1.18)
  }
}

.red-pulse{
  animation:redPulse 1.1s ease-in-out infinite
}

@keyframes amberGlow{
  0%,100%{
    box-shadow:0 0 0 0 rgba(245,158,11,.45)
  }

  50%{
    box-shadow:0 0 0 5px rgba(245,158,11,0)
  }
}

.amber-glow{
  animation:amberGlow 1.6s ease-in-out infinite
}

.needle{
  transition:transform 1s cubic-bezier(.22,1,.36,1)
}

.gauge-face{
  background:radial-gradient(circle at 38% 30%,#1E3A5F 0%,#122A4A 38%,#0A1628 78%,#07101F 100%)
}

.glass-sheen{
  background:linear-gradient(115deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,.08) 22%,rgba(255,255,255,0) 48%)
}

.lcd{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace
}

.sweep{
  animation:sweep 9s linear infinite;
  transform-origin:center
}

.drift{
  animation:drift 5s ease-in-out infinite alternate
}

.rain{
  animation:rainMove 2.2s linear infinite
}
