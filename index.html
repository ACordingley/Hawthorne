:root{
  --bg:#F8FAFC;
  --card-bg:#FFFFFF;
  --card-border:#E2E8F0;
  --text:#0F172A;
  --muted:#64748B;
  --muted2:#94A3B8;
  --line:#E2E8F0;
  --panel:#FFFFFF;
  --chip:#F1F5F9;
  --accent:#06B6D4;
  --green:#16A34A;
  --amber:#F59E0B;
  --red:#EF4444;
  --gauge-face:#0A1628;
  --shadow:0 1px 2px rgba(15,23,42,.05), 0 8px 24px rgba(15,23,42,.04);
}

[data-theme="night"]{
  --bg:#0A0F1E;
  --card-bg:rgba(255,255,255,0.05);
  --card-border:rgba(255,255,255,.12);
  --text:#E2E8F0;
  --muted:#94A3B8;
  --muted2:#64748B;
  --line:rgba(255,255,255,.12);
  --panel:#0F172A;
  --chip:rgba(255,255,255,.08);
  --shadow:0 1px 2px rgba(0,0,0,.3);
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  padding:0
}

body{
  font-family:'Archivo',ui-sans-serif,system-ui,sans-serif;
  background:var(--bg);
  color:var(--text)
}

.mono{
  font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace
}

.card{
  background:var(--card-bg);
  border:1px solid var(--card-border);
  border-radius:12px;
  box-shadow:var(--shadow)
}

.pill{
  border-radius:999px
}

@keyframes pulseDot{
  0%,100%{
    transform:scale(1);
    opacity:1
  }

  50%{
    transform:scale(1.55);
    opacity:.55
  }
}

@keyframes sweepSpin{
  from{
    transform:rotate(0deg)
  }

  to{
    transform:rotate(360deg)
  }
}

@keyframes blink{
  0%,100%{
    opacity:1
  }

  50%{
    opacity:.25
  }
}

@keyframes drift{
  0%{
    transform:translate(0,0)
  }

  50%{
    transform:translate(10px,-6px)
  }

  100%{
    transform:translate(0,0)
  }
}

@keyframes radarPulse{
  0%{
    transform:scale(.7);
    opacity:.9
  }

  100%{
    transform:scale(1.35);
    opacity:0
  }
}

.sweep{
  animation:sweepSpin var(--sweep-dur,4s) linear infinite
}

.paused .sweep{
  animation-play-state:paused
}

.glow-green{
  box-shadow:0 0 0 3px rgba(22,163,74,.18),0 0 12px rgba(22,163,74,.55)
}

.glow-amber{
  box-shadow:0 0 0 3px rgba(245,158,11,.18),0 0 12px rgba(245,158,11,.55)
}

.glow-red{
  box-shadow:0 0 0 3px rgba(239,68,68,.22),0 0 14px rgba(239,68,68,.65);
  animation:pulseDot 1.1s infinite
}

input[type=range]{
  accent-color:#06B6D4;
  width:100%
}

.no-scrollbar::-webkit-scrollbar{
  display:none
}

.hover\:bg-slate-700:hover {
  --tw-bg-opacity: 1;

}
